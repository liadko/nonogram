spring:
  application:
    name: nonogram

  h2:
    console:
      enabled: true

  datasource:
    url: "jdbc:h2:mem:nonogram;DB_CLOSE_DELAY=-1"
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  thymeleaf:
    cache: false
  web:
    resources:
      cache:
        period: 0
  devtools:
    # Option A: disable restart (fastest if WSL IO is slow)
    restart:
      enabled: false



server:
  port: 8081

logging:
  level:
    web.view.controller: DEBUG
