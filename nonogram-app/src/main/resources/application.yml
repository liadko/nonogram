spring:
  application:
    name: nonogram

  # --- Datasource Configuration for PostgreSQL ---
  datasource:
    url: "jdbc:postgresql://localhost:5432/nonogram_db"
    username: liadkoren
    password: password123
  # --- JPA & Hibernate Configuration ---
  jpa:
    hibernate:
      ddl-auto: update

  # --- Development-time Settings ---
  thymeleaf:
    cache: false # Disable Thymeleaf caching during development for hot reload.
  web:
    resources:
      cache:
        period: 0 # Disable static resource caching (css/js).
  devtools:
    restart:
      enabled: true

server:
  port: 8081

feature:
  distributed-jobs: false
