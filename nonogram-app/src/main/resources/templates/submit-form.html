<!DOCTYPE html>
<!-- The xmlns:th attribute enables Thymeleaf's special attributes -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nonogram Solver</title>
    <!-- Basic styling for a cleaner look -->
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 2em auto;
            padding: 1em;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-bottom: 0.5em;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 1em;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h1>Submit a Nonogram Job by URL</h1>

<!--
    This is the core of the template logic.
    - th:action="@{/submit-url}" : This tells Thymeleaf to generate the URL for the form submission.
      It will point to the @PostMapping in our ViewController.
    - th:object="${urlJobRequest}" : This binds the form to the "urlJobRequest" object we put in the model.
      This is our form-backing object.
    - method="post" : Specifies the HTTP method.
-->
<form th:action="@{/submit-url}" th:object="${urlJobRequest}" method="post">
    <div>
        <label for="url">Puzzle URL:</label>
        <!--
            th:field="*{url}" is the magic.
            - It links this input to the 'url' property of the 'urlJobRequest' object.
            - It sets the 'id' and 'name' attributes of the input tag correctly.
            - It sets the 'value' of the input to the current value of the property (which we pre-populated in the controller).
        -->
        <input type="text" id="url" th:field="*{url}" required>
    </div>
    <div>
        <label for="budgetMs">Time Budget (ms):</label>
        <input type="number" id="budgetMs" th:field="*{budgetMs}" required>
    </div>
    <div>
        <button type="submit">Submit Job</button>
    </div>
</form>
</body>
</html>
